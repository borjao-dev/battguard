name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck system/battguard-helper install.sh uninstall.sh scripts/*.sh tests/*.sh
      - name: Helper tests
        run: bash tests/test_helper.sh
      - name: Applet tests
        run: node tests/test_applet.js
      - name: Validate XML and JSON
        run: |
          sudo apt-get install -y libxml2-utils
          sed 's|@HELPER_PATH@|/usr/libexec/battguard/battguard-helper|' system/io.github.battguard.policy.in | xmllint --noout -
          for f in battguard@*/info.json battguard@*/files/*/metadata.json; do python3 -m json.tool "$f" >/dev/null; done
